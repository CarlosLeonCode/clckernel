<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 620" width="100%" height="100%" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-standalone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="grad-gentle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="line-standalone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="line-gentle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow-core" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.15"/>
    </filter>
    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
  </pattern>
  <rect width="1024" height="620" fill="url(#grid)" />

  <!-- Header -->
  <text x="512" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
    CLC Kernel — Standalone vs. Gentle AI Symbiosis
  </text>
  <text x="512" y="68" text-anchor="middle" font-size="13" font-weight="400" fill="#94a3b8">
    Deterministic Local AI Governance with Optional High-Assurance Ecosystem Companions
  </text>

  <!-- ================= TOP: CORE GOVERNANCE ENGINE ================= -->
  <g transform="translate(162, 95)" filter="url(#glow-core)">
    <rect width="700" height="135" rx="12" fill="url(#grad-core)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Badge -->
    <rect x="20" y="16" width="128" height="24" rx="12" fill="#0369a1" fill-opacity="0.4"/>
    <text x="84" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">CORE GOVERNANCE</text>

    <!-- Title -->
    <text x="160" y="33" font-size="16" font-weight="700" fill="#f1f5f9">
      🤖 CLC Kernel (Engine &amp; AIUP Harness)
    </text>

    <!-- 4 Core Pillars inside Core -->
    <g transform="translate(20, 52)">
      <!-- Pillar 1: SSOT -->
      <rect x="0" y="0" width="155" height="66" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-size="12" font-weight="700" fill="#38bdf8">1. SSOT Law</text>
      <text x="12" y="40" font-size="10" fill="#cbd5e1">AGENTS.md &amp; IDE Mirrors</text>
      <text x="12" y="54" font-size="9" fill="#64748b">Symlinks: Cursor, Claude, etc.</text>

      <!-- Pillar 2: SDD & TDD -->
      <rect x="168" y="0" width="155" height="66" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="180" y="22" font-size="12" font-weight="700" fill="#38bdf8">2. SDD &amp; TDD</text>
      <text x="180" y="40" font-size="10" fill="#cbd5e1">sdds/{change}/spec.md</text>
      <text x="180" y="54" font-size="9" fill="#64748b">HITL Approval &amp; Red-Green</text>

      <!-- Pillar 3: AST Guards -->
      <rect x="336" y="0" width="155" height="66" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="348" y="22" font-size="12" font-weight="700" fill="#38bdf8">3. AST Guards (&lt;5ms)</text>
      <text x="348" y="40" font-size="10" fill="#cbd5e1">Layer &amp; Secret Scanners</text>
      <text x="348" y="54" font-size="9" fill="#64748b">Zero foreign dependencies</text>

      <!-- Pillar 4: 4-Lens Audit -->
      <rect x="504" y="0" width="156" height="66" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="516" y="22" font-size="12" font-weight="700" fill="#38bdf8">4. 4-Lens Audit</text>
      <text x="516" y="40" font-size="10" fill="#cbd5e1">audit-receipt.json</text>
      <text x="516" y="54" font-size="9" fill="#38bdf8">Immutable Proof Contract</text>
    </g>
  </g>

  <!-- ================= SPLIT CONNECTING PATHS ================= -->
  <!-- Left Path: Standalone -->
  <path d="M 330 230 L 330 290" fill="none" stroke="url(#line-standalone)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="330,300 325,290 335,290" fill="#10b981"/>

  <!-- Right Path: Symbiosis Bridge -->
  <path d="M 694 230 L 694 290" fill="none" stroke="url(#line-gentle)" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="694,300 689,290 699,290" fill="#8b5cf6"/>

  <!-- Bridge Label in the middle -->
  <rect x="420" y="246" width="184" height="26" rx="13" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="512" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">
    Operational Deployment Modes
  </text>

  <!-- ================= LEFT COLUMN: MODE 1 STANDALONE ================= -->
  <g transform="translate(60, 305)" filter="url(#glow-card)">
    <rect width="425" height="280" rx="12" fill="url(#grad-standalone)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Header & Badge -->
    <rect x="20" y="16" width="150" height="24" rx="12" fill="#065f46" fill-opacity="0.6"/>
    <text x="95" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">MODE 1: STANDALONE</text>
    <text x="182" y="33" font-size="15" font-weight="700" fill="#f8fafc">100% Self-Sufficient</text>

    <!-- Subtitle -->
    <text x="20" y="60" font-size="11.5" fill="#a7f3d0">
      Zero foreign dependencies. Works completely offline &amp; locally.
    </text>

    <!-- Feature Items -->
    <g transform="translate(20, 78)">
      <!-- Item 1 -->
      <circle cx="10" cy="12" r="5" fill="#10b981"/>
      <text x="24" y="16" font-size="12" font-weight="600" fill="#f1f5f9">Native AST Execution in &lt; 5ms</text>
      <text x="24" y="30" font-size="10.5" fill="#94a3b8">Runs in your stack's native language (Python, Node, Go, Rust, Ruby).</text>

      <!-- Item 2 -->
      <circle cx="10" cy="50" r="5" fill="#10b981"/>
      <text x="24" y="54" font-size="12" font-weight="600" fill="#f1f5f9">Deterministic Pre-Commit Gate</text>
      <text x="24" y="68" font-size="10.5" fill="#94a3b8">Git hook physically rejects non-compliant commits before push.</text>

      <!-- Item 3 -->
      <circle cx="10" cy="88" r="5" fill="#10b981"/>
      <text x="24" y="92" font-size="12" font-weight="600" fill="#f1f5f9">4-Lens Educational Summary</text>
      <text x="24" y="106" font-size="10.5" fill="#94a3b8">Emits human-readable reports in sdds/{active-sdd}/05-audit-report.md.</text>

      <!-- Item 4 -->
      <circle cx="10" cy="126" r="5" fill="#10b981"/>
      <text x="24" y="130" font-size="12" font-weight="600" fill="#f1f5f9">Local Cryptographic Receipt</text>
      <text x="24" y="144" font-size="10.5" fill="#94a3b8">Generates audit-receipt.json bound to commit hash automatically.</text>

      <!-- Bottom Status Pill -->
      <rect x="0" y="164" width="385" height="26" rx="6" fill="#064e3b" fill-opacity="0.7"/>
      <text x="192" y="181" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6ee7b7">
        ✅ Ideal for: Solo engineers, air-gapped CI/CD, fast local workflows
      </text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: MODE 2 GENTLE AI SYMBIOSIS ================= -->
  <g transform="translate(539, 305)" filter="url(#glow-card)">
    <rect width="425" height="280" rx="12" fill="url(#grad-gentle)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Header & Badge -->
    <rect x="20" y="16" width="168" height="24" rx="12" fill="#5b21b6" fill-opacity="0.6"/>
    <text x="104" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#c4b5fd">MODE 2: + GENTLE AI</text>
    <text x="200" y="33" font-size="15" font-weight="700" fill="#f8fafc">Progressive Symbiosis</text>

    <!-- Subtitle -->
    <text x="20" y="60" font-size="11.5" fill="#ddd6fe">
      Consumes audit-receipt.json to unlock team &amp; multi-agent capabilities.
    </text>

    <!-- Feature Items -->
    <g transform="translate(20, 78)">
      <!-- Companion 1: Gentle AI RDD -->
      <circle cx="10" cy="12" r="5" fill="#8b5cf6"/>
      <text x="24" y="16" font-size="12" font-weight="600" fill="#f1f5f9">🛡️ Gentle AI Multi-Lens Review (RDD)</text>
      <text x="24" y="30" font-size="10.5" fill="#94a3b8">Adversarial dual review (Judges, Refuters, Canonical 4R Lenses).</text>

      <!-- Companion 2: Engram MCP -->
      <circle cx="10" cy="50" r="5" fill="#8b5cf6"/>
      <text x="24" y="54" font-size="12" font-weight="600" fill="#f1f5f9">🧠 Engram Architectural Memory (MCP)</text>
      <text x="24" y="68" font-size="10.5" fill="#94a3b8">Persistent context, ADR tracking, and cross-session knowledge retention.</text>

      <!-- Companion 3: Graphify -->
      <circle cx="10" cy="88" r="5" fill="#8b5cf6"/>
      <text x="24" y="92" font-size="12" font-weight="600" fill="#f1f5f9">🕸️ Graphify Dependency Intelligence</text>
      <text x="24" y="106" font-size="10.5" fill="#94a3b8">Visual dependency graphs, blast-radius analysis &amp; code topology.</text>

      <!-- Companion 4: Receipt Bridge -->
      <circle cx="10" cy="126" r="5" fill="#8b5cf6"/>
      <text x="24" y="130" font-size="12" font-weight="600" fill="#f1f5f9">🔗 Zero-Lock-In Cryptographic Handshake</text>
      <text x="24" y="144" font-size="10.5" fill="#94a3b8">Receipt passes directly to Gentle AI with gentle_ai.rdd_ready: true.</text>

      <!-- Bottom Status Pill -->
      <rect x="0" y="164" width="385" height="26" rx="6" fill="#3b0764" fill-opacity="0.7"/>
      <text x="192" y="181" text-anchor="middle" font-size="10.5" font-weight="600" fill="#d8b4fe">
        🚀 Ideal for: High-assurance teams, multi-agent pipelines &amp; complex codebases
      </text>
    </g>
  </g>
</svg>
