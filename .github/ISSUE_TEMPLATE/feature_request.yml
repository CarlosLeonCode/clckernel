name: Feature request
description: Suggest a new guard, stack, command or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. For a new guard, describe what it should check and give an example that should pass and one that should fail.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: stack
    attributes:
      label: Affected stack(s)
      placeholder: "FastAPI, Next.js, all..."
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this (see CONTRIBUTING.md).
