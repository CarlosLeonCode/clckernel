# CLC Kernel — AI Agent Governance Configuration
# Schema: tools/_config.js (keys documented in README.md, "Configuration").

# Paths no diff-based guard evaluates.
exclude_paths:
  - "node_modules/**"
  - "coverage/**"
  - ".git/**"
  - ".antigravity/**"

# The Python guards in tools/ are tested by the JS suite (test/*.test.js):
# verify_tdd.js counts them as production code, so a change to one needs a
# test that fails without it.
tdd:
  code:
    - "tools/**/*.py"
